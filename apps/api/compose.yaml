services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgera}
      POSTGRES_USER: ${POSTGRES_USER:-ledgera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgera}
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18 stores versioned clusters below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ledgera} -d ${POSTGRES_DB:-ledgera}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ledgera}:${POSTGRES_PASSWORD:-ledgera}@postgres:5432/${POSTGRES_DB:-ledgera}?sslmode=disable
      DATABASE_HEALTH_TIMEOUT: ${DATABASE_HEALTH_TIMEOUT:-2s}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
